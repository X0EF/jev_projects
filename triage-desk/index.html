<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">Support routing</div>
      <h1>Triage Desk</h1>
      <p class="blurb">Paste a ticket. Jev picks a queue, scores urgency, and says whether a refund was asked.</p>
      <nav class="nav"><a href="/">Index</a> <a href="/triage-desk/">Triage Desk</a> <a href="/lead-fit/">Lead Fit</a> <a href="/listing-cop/">Listing Cop</a> <a href="/cite-check/">Cite Check</a> <a href="/prompt-guard/">Prompt Guard</a> <a href="/skill-pick/">Skill Pick</a> <a href="/resume-match/">Resume Match</a> <a href="/clause-finder/">Clause Finder</a></nav>
    </header>
    <div class="grid">
      <form id="form" class="panel" data-render="renderTriage">
        <label for="ticket">Ticket</label>
<textarea id="ticket" name="ticket" required>Hi, I've been trying to connect my Stripe account for 3 days and it keeps failing. I'm losing sales. Please help ASAP.</textarea>
<label for="policy">Policy (optional)</label>
<textarea id="policy" name="policy">Refunds within 14 days for duplicate charges. Integration bugs go to technical.</textarea>
        <button id="go" type="submit">Triage</button>
        <p class="err" id="err"></p>
      </form>
      <div class="panel" id="out">
        <p class="meta">Result lands here. Jev returns labels and probabilities, not essays.</p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
