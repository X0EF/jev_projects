<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listing Cop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">Marketplace trust</div>
      <h1>Listing Cop</h1>
      <p class="blurb">Paste a listing. Jev stamps allow, warn, or block without writing a review.</p>
      <nav class="nav"><a href="/">Index</a> <a href="/triage-desk/">Triage Desk</a> <a href="/lead-fit/">Lead Fit</a> <a href="/listing-cop/">Listing Cop</a> <a href="/cite-check/">Cite Check</a> <a href="/prompt-guard/">Prompt Guard</a> <a href="/skill-pick/">Skill Pick</a> <a href="/resume-match/">Resume Match</a> <a href="/clause-finder/">Clause Finder</a></nav>
    </header>
    <div class="grid">
      <form id="form" class="panel" data-render="renderListing">
        <label for="listing">Title + description</label>
<textarea id="listing" name="listing" required>Brand new unused Apple Airpods Pro 2 replica 1:1 quality. Ships from warehouse. Better than authentic, half price. WhatsApp to pay.</textarea>
        <button id="go" type="submit">Check listing</button>
        <p class="err" id="err"></p>
      </form>
      <div class="panel" id="out">
        <p class="meta">Result lands here. Jev returns labels and probabilities, not essays.</p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
